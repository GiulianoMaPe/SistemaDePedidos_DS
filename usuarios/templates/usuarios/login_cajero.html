<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login Cajero</title>
    <style>
        body, html {
            height: 100%; margin: 0; font-family: Arial, sans-serif;
            background-color: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-box {
            background-color: white;
            color: #333;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 300px;
        }
        h2 { text-align: center; color: #722f37; }
        div { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box; /* Para que el padding no afecte el ancho */
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #722f37;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Inicio de Sesión (HU-06)</h2>

        <!-- Este formulario enviará un 'POST' a la misma URL -->
        <form method="post">
            {% csrf_token %} <!-- Requerido por Django -->
            <div>
                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" name="usuario">
            </div>
            <div>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password">
            </div>
            <!-- Este botón activa el 'POST' -->
            <button type="submit">Ingresar</button>
        </form>
    </div>
</body>
</html>
