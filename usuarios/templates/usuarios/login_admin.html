<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login Administrador</title>
    <style>
        body, html {
            height: 100%; margin: 0; font-family: Arial, sans-serif;
            background-color: #333; /* Fondo oscuro */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-box {
            background-color: #444; /* Caja oscura */
            color: #fff; /* Texto blanco */
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            width: 300px;
        }
        h2 { text-align: center; color: #f5c5c5; } /* Título rojo claro */
        div { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            background-color: #555;
            border: 1px solid #666;
            color: white;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #722f37; /* Rojo vino (igual al de la bienvenida) */
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Inicio de Sesión (Admin)</h2>

        <form method="post">
            {% csrf_token %}
            <div>
                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" name="usuario">
            </div>
            <div>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password">
            </div>
            <button type="submit">Ingresar</button>
        </form>
    </div>
</body>
</html>
